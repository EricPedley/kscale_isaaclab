# PufferLib PPO configuration for Ant environment
# Derived from skrl_ppo_cfg.yaml hyperparameters

[base]
seed = 42

[policy]
# Network architecture
hidden_layers = [256, 128, 64]
activation = elu
initial_log_std = 0.0
separate_value_network = False

[train]
seed = 42
device = cuda
total_timesteps = 10_000_000
learning_rate = 3.0e-04
anneal_lr = True
optimizer = adam

# PPO hyperparameters
gamma = 0.99
gae_lambda = 0.95
update_epochs = 4
clip_coef = 0.2
vf_clip_coef = 0.2
vf_coef = 1.0
ent_coef = 0.0
max_grad_norm = 1.0

# Batch sizes
rollout_steps = 16
mini_batches = 2
batch_size = auto
minibatch_size = auto
bptt_horizon = auto

# Precision and compilation
precision = float32
compile = False
cpu_offload = False
torch_deterministic = True

# Checkpointing
checkpoint_interval = 200
data_dir = experiments

# Adam optimizer params
adam_beta1 = 0.9
adam_beta2 = 0.999
adam_eps = 1e-8

[experiment]
directory = ant
experiment_name =
write_interval = 100
